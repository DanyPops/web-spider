name: Publish Packages

# Trusted publishing (OIDC) for the @danypops scope. npm CLI (>= 11.5.1)
# detects OIDC automatically. Configure one trusted publisher **per package**
# on npmjs.com: org=DanyPops repo=web-spider workflow=publish.yml -- this
# must be done once for each of @danypops/web-spider, @danypops/web-spider-daemon,
# and @danypops/pi-web-spider individually before that package's first
# trusted-publish run will succeed; a package with no trusted publisher
# configured yet will fail its publish step with a 404/403, not silently skip.

on:
  push:
    tags:
      - "v*"
      - "web-spider-daemon-v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # NO registry-url: it writes an .npmrc with an empty NODE_AUTH_TOKEN
      # line, shadowing OIDC and breaking trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm can be older.
      - run: npm install -g npm@latest && npm --version

      - uses: oven-sh/setup-bun@v2 # Bun drives build/lint/test for every package here, including web-spider-daemon's own bun:sqlite/bun test — Node is kept below only for the actual npm publish step.
        with:
          bun-version: latest

      - run: bun install
      - run: bun run lint:ci

      # Several tests (web-spider's lightpanda.test.ts, web-spider-daemon's
      # session/layout-check/contrast-check/service-playwright-lifecycle
      # suites) launch a real headless Chromium -- a fresh runner has no
      # browser binary at all. --with-deps also installs the OS-level
      # libraries (fonts, libnss3, etc.) headless Chromium needs to run,
      # which a minimal Ubuntu image does not have preinstalled.
      - run: bunx playwright-core install --with-deps chromium

      - run: bun run --filter '*' build
      - run: bun run --filter '*' check
      - run: bun run --filter '*' test

      # Dependency order: web-spider-daemon depends on web-spider; the
      # extension depends on both.
      #
      # Idempotent by design, not just "best effort" -- if a prior run of this
      # same tag already published one package (e.g. a later package's first
      # trusted-publisher config was missing on npmjs.com, so the job stopped
      # partway through), re-running the workflow must be able to pick up
      # cleanly instead of hard-failing on "cannot publish over previously
      # published version" for the package(s) that already succeeded.
      - run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish --access public
          fi
        working-directory: packages/web-spider
      - run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish --access public
          fi
        working-directory: packages/web-spider-daemon
      - run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish --access public
          fi
        working-directory: packages/pi-web-spider
