name: CI

# Runs on every push/PR -- web-spider previously had no pre-merge CI at all,
# only publish.yml's tag-triggered checks. Bun drives everything here (build,
# lint, test); Node/npm is kept only for publish.yml's actual npm publish
# step, same split as the rest of the ecosystem.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint:ci
      - run: bunx playwright-core install --with-deps chromium
      - run: bun run --filter '*' build
      - run: bun run --filter '*' check
      - run: bun run --filter '*' test
