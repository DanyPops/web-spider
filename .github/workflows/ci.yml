name: CI

# Runs on every push/PR -- web-spider previously had no pre-merge CI at all,
# only publish.yml's tag-triggered checks. Bun drives everything here (build,
# lint, test); Node/npm is kept only for publish.yml's actual npm publish
# step, same split as the rest of the ecosystem.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint:ci
      # NOT bunx: it fetches whatever the latest playwright-core is from
      # the registry, a different version (and Chromium revision) than the
      # project's own pinned ^1.60.0 -- "Executable doesn't exist" at test
      # time. Run the project's own locally-resolved binary instead.
      - run: ./node_modules/.bin/playwright-core install --with-deps chromium
        working-directory: packages/web-spider
      - run: bun run build
      - run: bun run check
      - run: bun run test
